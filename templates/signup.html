<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <script 
            src="https://code.jquery.com/jquery-3.7.1.min.js" 
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" 
            crossorigin="anonymous">
    </script>
</head>
<body>
    <div id="signup">
        <form action="auth/add" method="post">
            <input type="text" name="userid" id="userid" placeholder="Enter Your UserId">
            <input type="password" name="password" id="password" placeholder="Enter Your Password">
            <input type="password" name="password2" id="password2" placeholder="Enter Your Password">
            <input type="submit" value="Register">
            <input type="button" value="Clear" onclick="clear_signup()">
        </form>
    </div>
    <script>
        function clear_signup(){
            $("#userid").val('');
            $("#password").val('');
            $("#password2").val('');
        }
    </script>
</body>
</html>
